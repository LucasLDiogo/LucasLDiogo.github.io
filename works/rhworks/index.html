<style>
/* VOICE: ferramenta de trabalho de RH, calma, precisa, humana
   IDEA: um crivo (peneira) — a grade de pontos que deixa passar só o que adere à vaga
   PICTURE: o ranking e o anel de aderência de cada candidato
   COLOUR and TYPE: tinta #16141D, papel #F6F4EF, tangerina #A16207 para o selecionado, petróleo #0F5C6B de apoio; Sora + Inter
   LAYOUT: barra lateral escura, área de trabalho clara, conteúdo até 1240px */
:root{color-scheme:light;--tinta:#16141D;--tinta2:#26232F;--papel:#F6F4EF;--branco:#fff;--tang:#A16207;--tang2:#854D0E;--tangSoft:#FEF3C7;--pet:#0F5C6B;--petSoft:#E2EFF1;--nev:#E7E3DB;--nev2:#EFECE6;--cinza:#6D6A75;--cinza2:#9A97A1;--ok:#12805C;--okSoft:#E1F3EB;--mid:#B07A00;--midSoft:#FBF0D5;--lo:#C8372D;--loSoft:#FBE4E1;--r:14px;--sh:0 1px 2px rgba(22,20,29,.05),0 6px 24px -12px rgba(22,20,29,.18)}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--papel);color:var(--tinta);font:15px/1.55 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;overflow-x:clip;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:Sora,Inter,system-ui,sans-serif;margin:0;line-height:1.15;letter-spacing:-.01em}
h1{font-size:clamp(24px,2.6vw,32px);font-weight:700;text-wrap:balance}
h2{font-size:19px;font-weight:600}
h3{font-size:15px;font-weight:600}
a{color:var(--pet)}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
/* barra lateral */
.side{background:var(--tinta);color:#EDEAF2;padding:22px 16px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:22px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px;text-decoration:none;color:inherit}
.brand svg{width:30px;height:30px}
.brand b{font:500 23px/1 Sora,sans-serif;letter-spacing:-.02em}.brand b span{font-weight:800;color:#F2B544}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;color:#C9C5D2;text-decoration:none;font-weight:500}
.nav a svg{width:18px;height:18px;flex:none;opacity:.85}
.nav a:hover{background:var(--tinta2);color:#fff}
.nav a.on{background:#2E2A38;color:#fff}
.nav a.on svg{color:var(--tang);opacity:1}
.side .eng{margin-top:auto;background:var(--tinta2);border-radius:12px;padding:12px 14px;font-size:13px;color:#B9B5C3}
.side .eng b{display:block;color:#fff;font-weight:600;margin-bottom:2px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--cinza2);margin-right:6px;vertical-align:1px}
.dot.ok{background:#3DDC97}.dot.err{background:#FF7A6B}.dot.run{background:var(--tang);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.35}}
/* área principal */
.main{padding:28px clamp(16px,3.4vw,44px) 60px;max-width:1320px;width:100%}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.top p{margin:6px 0 0;color:var(--cinza)}
.crumbs{font-size:13px;color:var(--cinza);margin-bottom:6px}
.crumbs a{color:var(--cinza);text-decoration:none}.crumbs a:hover{color:var(--tinta)}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:0 16px;border-radius:10px;border:1px solid var(--nev);background:var(--branco);font-weight:600;font-size:14px;cursor:pointer;text-decoration:none;color:var(--tinta);white-space:nowrap;transition:background .15s,border-color .15s}
.btn:hover{border-color:#CFCAC0;background:#FBFAF7}
.btn.pri{background:var(--tang);border-color:var(--tang);color:#fff}.btn.pri:hover{background:var(--tang2)}
.btn.dark{background:var(--tinta);border-color:var(--tinta);color:#fff}.btn.dark:hover{background:#2E2A38}
.btn.ghost{background:transparent;border-color:transparent}.btn.ghost:hover{background:var(--nev2)}
.btn.sm{min-height:32px;padding:0 11px;font-size:13px;border-radius:8px}
.btn.danger{color:var(--lo)}
.btn svg{width:16px;height:16px}
.btn:disabled{opacity:.5;cursor:not-allowed}
:focus-visible{outline:2px solid var(--tang);outline-offset:2px}
.card{background:var(--branco);border:1px solid var(--nev);border-radius:var(--r);box-shadow:var(--sh)}
.pad{padding:20px}
.grid{display:grid;gap:16px}
.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}
.kpi{padding:18px 20px}
.kpi span{color:var(--cinza);font-size:13px;font-weight:500}
.kpi b{display:block;font:700 clamp(26px,3vw,34px)/1.1 Sora,sans-serif;margin-top:6px;font-variant-numeric:tabular-nums}
.kpi small{color:var(--cinza);font-size:12.5px}
.two{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.muted{color:var(--cinza)}
.small{font-size:13px}
.sec-t{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:28px 0 12px}
/* chips e pílulas */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;background:var(--nev2);font-size:12.5px;font-weight:500;color:#3C3946;white-space:nowrap}
.chip.ok{background:var(--okSoft);color:var(--ok)}.chip.lo{background:var(--loSoft);color:var(--lo)}.chip.mid{background:var(--midSoft);color:var(--mid)}.chip.pet{background:var(--petSoft);color:var(--pet)}.chip.tang{background:var(--tangSoft);color:var(--tang2)}
.rec{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:8px;font-size:12.5px;font-weight:600;white-space:nowrap}
.rec::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.rec.entrevistar{background:var(--okSoft);color:var(--ok)}.rec.validar{background:var(--midSoft);color:var(--mid)}.rec.nao{background:var(--loSoft);color:var(--lo)}.rec.pend{background:var(--nev2);color:var(--cinza)}
/* barras */
.bar{height:8px;border-radius:99px;background:var(--nev2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--pet)}
.bar i.hi{background:var(--ok)}.bar i.mid{background:#D9A11B}.bar i.lo{background:var(--lo)}
.score{display:flex;align-items:center;gap:10px;font-variant-numeric:tabular-nums}
.score b{font:700 17px Sora,sans-serif;width:34px;text-align:right}
.score .bar{flex:1;min-width:60px}
/* tabelas */
.tbl{width:100%;border-collapse:collapse}
.tbl th{font-size:12px;font-weight:600;color:var(--cinza);text-align:left;padding:10px 12px;border-bottom:1px solid var(--nev);white-space:nowrap}
.tbl td{padding:12px;border-bottom:1px solid var(--nev2);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr{cursor:pointer;transition:background .12s}
.tbl tbody tr:hover{background:#FBFAF7}
.tbl .num{text-align:right;font-variant-numeric:tabular-nums}
.who{display:flex;align-items:center;gap:10px}
.av{width:34px;height:34px;border-radius:10px;background:var(--petSoft);color:var(--pet);display:grid;place-items:center;font:600 13px Sora,sans-serif;flex:none}
.who b{display:block;font-weight:600}
.who small{color:var(--cinza);font-size:12.5px}
.rank{font:700 14px Sora,sans-serif;color:var(--cinza2);width:22px}
.scroll{overflow-x:auto}
/* vagas */
.vgrid{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.vaga{padding:18px 20px;display:flex;flex-direction:column;gap:12px;cursor:pointer;transition:transform .15s,box-shadow .15s}
.vaga:hover{transform:translateY(-2px);box-shadow:0 1px 2px rgba(22,20,29,.05),0 14px 30px -14px rgba(22,20,29,.28)}
.vaga h3{font-size:16.5px}
.sbar{display:flex;height:10px;border-radius:99px;overflow:hidden;background:var(--nev2)}
.sbar i{display:block;height:100%}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--cinza)}
.legend span::before{content:"";display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px;background:var(--c)}
.mini{display:flex;flex-direction:column;gap:6px}
.mini div{display:flex;justify-content:space-between;gap:10px;font-size:13.5px}
.mini div b{font-variant-numeric:tabular-nums}
/* formulário */
.form{display:grid;gap:18px}
.fs{padding:22px}
.fs>h2{display:flex;align-items:center;gap:10px;margin-bottom:4px}
.fs>h2 em{font-style:normal;font:600 12px Inter;color:var(--tang2);background:var(--tangSoft);border-radius:6px;padding:2px 7px}
.fs>p{margin:0 0 16px;color:var(--cinza);font-size:13.5px}
.row{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));margin-bottom:14px}
.row:last-child{margin-bottom:0}
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:#3C3946}
label.f small{font-weight:400;color:var(--cinza)}
.in,select.in,textarea.in{width:100%;min-height:42px;padding:9px 12px;border:1px solid #DCD7CE;border-radius:10px;background:#fff;font-size:15px;font-weight:400}
textarea.in{min-height:96px;resize:vertical;line-height:1.5}
.in:focus{border-color:var(--tang);outline:none;box-shadow:0 0 0 3px var(--tangSoft)}
.seg{display:inline-flex;background:var(--nev2);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:7px 13px;border-radius:8px;font-size:13.5px;font-weight:600;color:var(--cinza);cursor:pointer;min-height:34px}
.seg button.on{background:#fff;color:var(--tinta);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.tags{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:7px;border:1px solid #DCD7CE;border-radius:10px;background:#fff;min-height:46px}
.tags:focus-within{border-color:var(--tang);box-shadow:0 0 0 3px var(--tangSoft)}
.tags input{border:0;outline:0;flex:1;min-width:160px;padding:6px;font-size:15px;background:transparent}
.tag{display:inline-flex;align-items:center;gap:6px;background:var(--nev2);border-radius:8px;padding:4px 4px 4px 10px;font-size:13.5px;font-weight:500}
.tag.req{background:var(--tinta);color:#fff}
.tag button{border:0;background:transparent;cursor:pointer;color:inherit;opacity:.65;padding:2px 6px;border-radius:6px;font-size:12px}
.tag button:hover{opacity:1;background:rgba(127,127,127,.18)}
.tag .tg-peso{font-size:11px;font-weight:600;opacity:.8;border:1px solid currentColor;padding:1px 6px}
.sugs{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.sugs button{border:1px dashed #CFCAC0;background:transparent;border-radius:8px;padding:3px 9px;font-size:12.5px;cursor:pointer;color:var(--cinza)}
.sugs button:hover{border-color:var(--tang);color:var(--tang2)}
.pesos{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.peso{display:grid;grid-template-columns:1fr 46px;align-items:center;gap:4px 12px;font-size:13.5px;font-weight:600}
.peso input{grid-column:1/-1;accent-color:var(--tang);width:100%}
.peso output{text-align:right;font-variant-numeric:tabular-nums;color:var(--cinza)}
.note{display:flex;gap:12px;padding:14px 16px;border-radius:12px;background:var(--petSoft);color:#17414A;font-size:13.5px}
.note.warn{background:var(--midSoft);color:#5C4100}
.note svg{width:18px;height:18px;flex:none;margin-top:2px}
.lang{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.lang .in{flex:1}
.formbar{position:sticky;bottom:0;display:flex;justify-content:flex-end;gap:8px;padding:14px 0;background:linear-gradient(transparent,var(--papel) 35%)}
/* candidato */
.hero{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:22px;align-items:center;padding:22px}
.ring{position:relative;width:112px;height:112px}
.ring svg{width:112px;height:112px;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font:700 32px Sora,sans-serif;font-variant-numeric:tabular-nums}
.ring small{position:absolute;bottom:24px;left:0;right:0;text-align:center;font-size:11px;color:var(--cinza);font-weight:600}
.hero h1{font-size:26px}
.meta{display:flex;flex-wrap:wrap;gap:6px 16px;color:var(--cinza);font-size:13.5px;margin-top:8px}
.meta a{color:var(--pet);font-weight:500}
.duo{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.list{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:9px}
.list li{position:relative;padding-left:17px;font-size:14.5px;line-height:1.45}
.list li::before{content:"";position:absolute;left:0;top:7px;width:7px;height:7px;border-radius:50%;background:var(--c,var(--pet))}
.list.ok li{--c:var(--ok)}.list.lo li{--c:var(--lo)}.list.mid li{--c:#D9A11B}
.crit{display:grid;grid-template-columns:150px minmax(0,1fr) 40px;gap:8px 14px;align-items:center;font-size:14px}
.crit b{text-align:right;font-variant-numeric:tabular-nums}
.crit p{grid-column:1/-1;margin:-4px 0 6px;color:var(--cinza);font-size:12.5px}
.skills{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.sk{border:1px solid var(--nev);border-radius:12px;padding:12px 14px;background:#FDFCFA}
.sk header{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:600;font-size:14px}
.sk p{margin:6px 0 0;font-size:12.5px;color:var(--cinza);line-height:1.45}
.sk mark{background:var(--tangSoft);color:inherit;border-radius:3px;padding:0 2px}
.qs{counter-reset:q;display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none}
.qs li{counter-increment:q;display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;font-size:14.5px}
.qs li::before{content:counter(q);width:26px;height:26px;border-radius:8px;background:var(--tinta);color:#fff;display:grid;place-items:center;font:600 12px Sora}
.ia-box{border-left:3px solid var(--tang);padding:4px 0 4px 16px;font-size:15px}
.cvtext{white-space:pre-wrap;font-size:13px;line-height:1.55;max-height:420px;overflow:auto;background:#FBFAF7;border:1px solid var(--nev);border-radius:10px;padding:14px;margin-top:12px}
details>summary{cursor:pointer;font-weight:600;list-style:none;display:flex;align-items:center;gap:8px}
details>summary::-webkit-details-marker{display:none}
details>summary::before{content:"›";display:inline-block;transition:transform .15s;font-size:18px;line-height:1;color:var(--cinza)}
details[open]>summary::before{transform:rotate(90deg)}
/* filtros */
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--nev)}
.search{position:relative}
.search input{padding-left:36px;min-width:240px}
.search svg{position:absolute;left:11px;top:12px;width:17px;height:17px;color:var(--cinza)}
.switch{display:inline-flex;align-items:center;gap:8px;font-size:13.5px;font-weight:600;cursor:pointer;user-select:none}
.switch input{appearance:none;width:36px;height:20px;border-radius:99px;background:#D6D1C8;position:relative;cursor:pointer;transition:background .15s;margin:0;flex:none}
.switch input::after{content:"";position:absolute;width:16px;height:16px;border-radius:50%;background:#fff;top:2px;left:2px;transition:left .15s}
.switch input:checked{background:var(--tang)}.switch input:checked::after{left:18px}
.chk{width:18px;height:18px;accent-color:var(--tang);cursor:pointer}
/* modal */
.ov{position:fixed;inset:0;background:rgba(22,20,29,.55);display:grid;place-items:center;padding:20px;z-index:50;animation:fade .15s}
@keyframes fade{from{opacity:0}}
.modal{background:#fff;border-radius:18px;width:min(760px,100%);max-height:calc(100vh - 40px);overflow:auto;box-shadow:0 30px 80px -20px rgba(0,0,0,.45)}
.modal.wide{width:min(1100px,100%)}
.modal header{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:20px 22px;border-bottom:1px solid var(--nev);position:sticky;top:0;background:#fff;z-index:2}
.modal .body{padding:22px}
.modal footer{display:flex;justify-content:flex-end;gap:8px;padding:16px 22px;border-top:1px solid var(--nev);position:sticky;bottom:0;background:#fff}
.drop{border:2px dashed #D6D1C8;border-radius:14px;padding:30px 20px;text-align:center;cursor:pointer;transition:border-color .15s,background .15s;background:#FDFCFA;display:block}
.drop.over,.drop:hover{border-color:var(--tang);background:var(--tangSoft)}
.drop svg{width:34px;height:34px;color:var(--tang)}
.drop b{display:block;font:600 16px Sora;margin:8px 0 4px}
.files{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.file{display:flex;align-items:center;gap:10px;padding:9px 12px;border:1px solid var(--nev);border-radius:10px;font-size:13.5px}
.file .st{margin-left:auto;font-size:12.5px;color:var(--cinza);white-space:nowrap}
.file .st.ok{color:var(--ok)}.file .st.err{color:var(--lo);white-space:normal}
/* comparar */
.cmp table{width:100%;border-collapse:collapse;font-size:14px}
.cmp th,.cmp td{padding:10px 12px;border-bottom:1px solid var(--nev2);text-align:left;vertical-align:top}
.cmp th{font-size:12.5px;color:var(--cinza);font-weight:600;width:170px}
.yes{color:var(--ok);font-weight:700}.no{color:var(--lo);font-weight:700}
/* provedores */
.provs{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.prov{border:1.5px solid var(--nev);border-radius:14px;padding:16px;cursor:pointer;background:#fff;text-align:left;display:flex;flex-direction:column;gap:6px}
.prov.on{border-color:var(--tang);box-shadow:0 0 0 3px var(--tangSoft)}
.prov b{font:600 15px Sora}
.prov span{font-size:13px;color:var(--cinza);line-height:1.4}
.prov em{font-style:normal;font-size:11.5px;font-weight:600;color:var(--pet);background:var(--petSoft);border-radius:6px;padding:2px 7px;align-self:flex-start}
code{background:var(--nev2);border-radius:5px;padding:1px 5px;font-size:.92em}
/* toasts */
.toasts{position:fixed;right:18px;bottom:18px;display:flex;flex-direction:column;gap:8px;z-index:80;max-width:min(420px,calc(100vw - 36px))}
.toast{background:var(--tinta);color:#fff;border-radius:12px;padding:12px 16px;font-size:14px;box-shadow:0 12px 30px -10px rgba(0,0,0,.45);display:flex;gap:10px;align-items:flex-start;animation:up .2s}
.toast.err{background:#7A1F18}
@keyframes up{from{transform:translateY(10px);opacity:0}}
.empty{text-align:center;padding:56px 20px}
.empty svg.big{width:120px;height:120px;margin-bottom:14px}
.empty h2{font-size:22px;margin-bottom:8px}
.empty p{color:var(--cinza);max-width:520px;margin:0 auto 20px}
.spin{width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;display:inline-block;animation:sp .7s linear infinite;vertical-align:-2px;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
.hide{display:none!important}
.mb{margin-bottom:16px}
.mt{margin-top:16px}
.foot{margin-top:40px;font-size:12.5px;color:var(--cinza2);text-align:center}

/* ---- v2: clareza e fluxo ---- */
.side .eng a{display:block;color:inherit;text-decoration:none}.side .eng:hover{background:#2E2A38}
.foot a{color:inherit}
.lb{display:block;font-size:13px;font-weight:600;color:#3C3946;margin-bottom:6px}.lb small{font-weight:400;color:var(--cinza)}
.sn{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:8px;background:var(--tinta);color:#fff;font:600 13px Sora;flex:none}
.err{display:block;font-style:normal;font-size:12.5px;font-weight:600;color:var(--lo);min-height:0}
.err:empty{display:none}
.in.bad,.tags.bad{border-color:var(--lo);box-shadow:0 0 0 3px var(--loSoft)}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
/*steps*/.steps li{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:14px;align-items:center;padding:12px 14px;border-radius:12px}
.steps li .n{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font:600 14px Sora;background:var(--nev2);color:var(--cinza)}
.steps li b{font-weight:600;font-size:15px}.steps li p{margin:2px 0 0;font-size:13.5px;color:var(--cinza)}
.steps li.now{background:var(--tangSoft)}.steps li.now .n{background:var(--tang);color:#fff}
.steps li.ok .n{background:var(--okSoft);color:var(--ok)}.steps li.ok b{color:var(--cinza);text-decoration:line-through;text-decoration-color:#CFCAC0}
.steps.plain li{grid-template-columns:34px minmax(0,1fr);align-items:start;padding:10px 0}
.steps.plain li .n{background:var(--tinta);color:#fff}
.demo-card{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.next{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:600;color:var(--tang2)}
.next::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.next.ok{color:var(--ok)}
details.adv>summary{font:600 17px Sora}
.legend-rec{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;font-size:12.5px;color:var(--cinza);margin-top:12px}
.legend-rec .rec{margin-left:6px}
.foot-bar{border-bottom:0;border-top:1px solid var(--nev)}
select.etapa{min-height:34px;padding:4px 30px 4px 10px;font-size:13px;border-radius:8px;width:auto;max-width:170px;font-weight:600}
select.etapa.entrevista,select.etapa.proposta,select.etapa.contratado{background:var(--okSoft);color:var(--ok);border-color:#BFE3D2}
select.etapa.reprovado{background:var(--loSoft);color:var(--lo);border-color:#F1C7C1}
select.etapa.triagem{background:var(--midSoft);color:var(--mid);border-color:#EED9A0}
.hero{margin-bottom:12px}
.why{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:12px;font-size:13.5px;color:#3C3946}
.decide{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;padding:14px 18px;margin-bottom:16px;border-color:#E3D9CF;background:#FFFCF8}
.decide>div:first-child{display:flex;flex-direction:column}
.decide b{font:600 16px Sora}
.btn.danger{color:var(--lo)}.btn.danger:hover{border-color:#F1C7C1;background:var(--loSoft)}

.btn.danger.sel{background:var(--lo);color:#fff;border-color:var(--lo)}

select.etapa-more{width:auto;min-height:40px;font-size:13.5px}
.howto{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px;font-size:14.5px}
.howto li::marker{font-weight:700;color:var(--tang2)}
.drop-hint svg{width:44px;height:44px;color:var(--tang);margin-bottom:10px}

.tbl .who{min-width:200px}.tbl .who b{white-space:nowrap}
.tbl .who small{white-space:nowrap}
.legend-rec>span{display:inline-flex;align-items:center;gap:6px;margin-right:12px}

select.etapa{max-width:142px}

kbd{display:inline-block;min-width:20px;padding:1px 6px;border:1px solid var(--nev);border-bottom-width:2px;border-radius:5px;background:#fff;font:600 11.5px/1.5 Inter,sans-serif;color:var(--tinta);text-align:center}

function recomendar(score,ko){if(ko.length)return score>=70?'validar':'nao';return score>=75?'entrevistar':score>=55?'validar':'nao'}

const SYS=`Você é um(a) especialista sênior em Recrutamento e Seleção no Brasil. Analise a aderência de UM candidato a UMA vaga usando APENAS as evidências do currículo/perfil fornecido.
Regras obrigatórias:
- Não invente nada. O que não estiver no texto vira item de "validar".
- Nunca use nome, gênero, cor/raça, idade, estado civil, religião, aparência, deficiência ou origem como critério, nem tente deduzi-los (Lei 9.029/95). Avalie só competências, experiências, formação e requisitos objetivos.
- Seja específico: cite empresas, cargos, ferramentas, números e resultados que aparecem no texto.
- Português do Brasil, frases curtas e objetivas. Use linguagem neutra: escreva "a pessoa", "tem experiência em…" ou comece direto pelo fato. Nunca escreva "o candidato" ou "a candidata".
- Avalie SÓ o que a vaga pede. Não crie requisitos que a vaga não tem (idioma, viagem, CNH, certificação). Algo que a vaga não exige nunca é ponto de atenção nem item a validar.
- "pontos_atencao" só traz lacunas reais em relação à vaga. Requisito atendido ou superado (formação acima do mínimo, mais experiência que o pedido) é ponto forte, nunca atenção.
- Cada pergunta deve citar algo concreto do currículo (empresa, projeto, ferramenta ou número). Proibido pergunta genérica como "Como você lidou com desafios?". Bom exemplo: "Na Transportes X você reduziu o frete em 8%: qual foi a sua parte e como mediu?".
- "validar" traz dúvidas reais sobre requisitos DA VAGA que o texto não comprova.
Responda SOMENTE com um objeto JSON válido, sem nenhum texto fora dele, exatamente com estas chaves:
{"resumo":"2 a 3 frases sobre o perfil e a aderência à vaga","nota":0,"recomendacao":"entrevistar | validar | nao_priorizar","senioridade":"júnior | pleno | sênior | especialista","pontos_fortes":["..."],"pontos_atencao":["..."],"validar":["o que confirmar na entrevista"],"perguntas":["perguntas de entrevista específicas para este candidato"],"skills":[{"skill":"nome da hard skill da vaga","nivel":"forte | moderado | fraco | ausente","evidencia":"trecho curto do texto ou motivo"}]}
"nota" é um inteiro de 0 a 100 de aderência à vaga. Use de 3 a 5 itens em pontos_fortes, validar e perguntas (4 a 6 perguntas). Em pontos_atencao, de 0 a 4 itens: lista vazia é melhor do que lacuna inventada.`;

function redesenharTags(id,foco=true){const box=$(`[data-tags="${id}"]`);if(!box)return;const ph=box.querySelector('input').placeholder;box.outerHTML=tags(id,F[id],ph);ligarTags();marcarSugs();if(foco)$(`[data-tags="${id}"] input`)?.focus()}
function addTag(id,val,foco=true){val=val.trim().replace(/^\+\s*/,'').replace(/,$/,'');if(!val)return;if(F[id].some(x=>norm(x)===norm(val)))return;
 if(id==='hardObr'||id==='hardDes'){const outro=id==='hardObr'?'hardDes':'hardObr';const j=F[outro].findIndex(x=>norm(x)===norm(val));if(j>=0){F[outro].splice(j,1);redesenharTags(outro,false)}const e=$('#e_hard');if(e)e.textContent=''}
 F[id].push(val);redesenharTags(id,foco)}
function marcarSugs(){$$('[data-sug]').forEach(b=>{const L=b.dataset.sug==='hardObr'?[...F.hardObr,...F.hardDes]:F[b.dataset.sug];$$('button',b).forEach(x=>{x.classList.toggle('hide',L.some(y=>norm(y)===norm(x.textContent.replace(/^\+\s*/,''))))})})}
function ligarTags(){$$('[data-tags]').forEach(box=>{const id=box.dataset.tags;const inp=box.querySelector('input');inp.onkeydown=e=>{if(e.key==='Enter'||e.key===','){e.preventDefault();const val=inp.value;inp.value='';val.split(/[,;\n]/).forEach(x=>addTag(id,x))}else if(e.key==='Backspace'&&!inp.value&&F[id].length){F[id].pop();redesenharTags(id)}};inp.onblur=()=>{if(inp.value.trim()){const val=inp.value;inp.value='';val.split(/[,;\n]/).forEach(x=>addTag(id,x,false))}};box.onclick=e=>{const x=e.target.closest('.tg-x');if(x){F[id].splice(+x.dataset.i,1);redesenharTags(id)}else if(e.target===box)inp.focus()}})}

 $$('[data-sug]').forEach(b=>b.onclick=e=>{const t=e.target.closest('button');if(t)addTag(b.dataset.sug,t.textContent,false)});
 $$('[data-seg]').forEach(s=>s.onclick=e=>{const b=e.target.closest('button');if(!b)return;F[s.dataset.seg]=b.dataset.v;$$('button',s).forEach(x=>{x.classList.toggle('on',x===b);x.setAttribute('aria-pressed',x===b)})});
 Object.keys(CRIT).forEach(k=>{const r=$('#p_'+k);r.oninput=()=>{$('#o_'+k).textContent=r.value;F.pesos[k]=+r.value}});
 const lg=$('#langs');lg.oninput=lg.onchange=e=>{const t=e.target;if(t.dataset.li!=null)F.idiomas[+t.dataset.li][t.dataset.k]=t.dataset.k==='nivel'?+t.value:t.value};
 ['titulo','cidade'].forEach(k=>{const el=$('#f_'+k);el.oninput=()=>{$('#e_'+k).textContent='';el.classList.remove('bad')}});
 $('#fv').onsubmit=e=>{e.preventDefault();lerForm();const erros=[];
  if(!F.titulo)erros.push(['titulo','Dê um título para a vaga']);if(!F.cidade)erros.push(['cidade','Informe a cidade de trabalho']);if(!F.hardObr.length&&!F.soft.length)erros.push(['hard','Inclua ao menos uma hard skill obrigatória — é a base da nota']);
  $$('.err').forEach(x=>x.textContent='');$$('.bad').forEach(x=>x.classList.remove('bad'));
  if(erros.length){erros.forEach(([k,m])=>{const el=$('#e_'+k);if(el)el.textContent=m;const inp=k==='hard'?$('[data-tags="hardObr"]'):$('#f_'+k);if(inp)inp.classList.add('bad')});const f=erros[0][0];const alvo=f==='hard'?$('[data-tags="hardObr"] input'):$('#f_'+f);alvo.scrollIntoView({behavior:'smooth',block:'center'});setTimeout(()=>alvo.focus({preventScroll:true}),300);return}
  const v={...F};v.hard=[...F.hardObr.map(n=>({nome:n,peso:'obrigatoria'})),...F.hardDes.map(n=>({nome:n,peso:'desejavel'}))];delete v._ed;delete v.hardObr;delete v.hardDes;v.idiomas=v.idiomas.filter(l=>l.nome.trim());const i=S.vagas.findIndex(x=>x.id===v.id);if(i>=0)S.vagas[i]=v;else S.vagas.push(v);F=null;save();
  const cs=candsDa(v.id);cs.forEach(c=>analisar(c,{ia:true}));ir('#vaga-'+v.id);
  if(i>=0)toast(`Vaga salva${cs.length?' — reanalisando '+cs.length+' candidato(s)':''}`);else{toast('Vaga criada. Agora envie os currículos.');setTimeout(()=>modalCand(v.id),250)}}};
function lerForm(){['titulo','area','nivel','contrato','salario','descricao','resp','cidade','uf','cnh','afirmativa'].forEach(k=>{const el=$('#f_'+k);if(el)F[k]=el.value.trim()});F.formacaoMin=+$('#f_formacaoMin').value;F.expMin=+$('#f_expMin').value||0;F.idadeMin=+$('#f_idadeMin').value||18}

 ${!todos.length?`<section class="card empty"><div class="drop-hint">${ICON.up}</div><h2>Agora envie os currículos</h2><p>Arraste vários arquivos de uma vez (PDF, DOCX ou TXT) ou o PDF do LinkedIn de cada candidato. A nota sai na hora; o parecer do Llama vem em seguida.</p><div class="acts" style="justify-content:center"><button class="btn pri" data-act="addcand" data-id="${v.id}">${ICON.up} Enviar currículos</button></div></section>`:`

/* ============ sugerir perfil com IA ============ */
async function sugerir(){lerForm();if(!F.titulo){const e=$('#e_titulo');if(e)e.textContent='Escreva o título primeiro';$('#f_titulo').focus();return}const b=$('[data-act="sugerir"]');b.disabled=true;b.innerHTML='<span class="spin"></span> Pensando…';
 try{const o=parseJSON(await chat([{role:'system',content:'Você é especialista em recrutamento no Brasil. Responda somente JSON válido, em português do Brasil.'},{role:'user',content:`Monte o perfil da vaga "${F.titulo}" (nível ${NIVEIS[F.nivel]}${F.area?', área '+F.area:''}). Contexto: ${F.descricao||'empresa brasileira'}. Responda com JSON: {"descricao":"2 frases","responsabilidades":["5 itens"],"hard_obrigatorias":["3 a 5"],"hard_desejaveis":["2 a 4"],"soft":["3 a 5"],"diferenciais":["1 a 3"],"anos_experiencia":0}. Não inclua critérios de idade, sexo, cor/raça ou aparência.`}]));
  if(o.descricao&&!F.descricao)F.descricao=String(o.descricao);if(Array.isArray(o.responsabilidades)&&!F.resp)F.resp=o.responsabilidades.join('\n');const add=(l,id)=>(Array.isArray(l)?l:[]).forEach(n=>{n=String(n||'').trim();if(n&&![...F.hardObr,...F.hardDes].some(x=>norm(x)===norm(n)))F[id].push(n)});add(o.hard_obrigatorias,'hardObr');add(o.hard_desejaveis,'hardDes');(Array.isArray(o.soft)?o.soft:[]).forEach(x=>{if(x&&!F.soft.some(y=>norm(y)===norm(x)))F.soft.push(String(x))});(Array.isArray(o.diferenciais)?o.diferenciais:[]).forEach(x=>{if(x&&!F.diferenciais.includes(x))F.diferenciais.push(String(x))});if(+o.anos_experiencia>0)F.expMin=+o.anos_experiencia;render();toast('Competências sugeridas. Revise e ajuste antes de salvar.')}
 catch(e){toast(esc(e.message),{err:true});b.disabled=false;b.innerHTML=ICON.spark+' Sugerir competências com IA'}}

/* ============ exportação ============ */
function baixar(nome,conteudo,tipo){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([conteudo],{type:tipo}));a.download=nome;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},800)}
function csv(vid){const v=vagaDe(vid);const q=s=>`"${String(s??'').replace(/"/g,'""')}"`;const u=l=>[...new Set(l)];const rows=[['Posição','Candidato','E-mail','Telefone','Cidade','LinkedIn','Aderência','Nota critérios','Nota IA','Recomendação','Obrigatórias atendidas','Experiência (anos)','Formação','Etapa','Pontos fortes','Atenção','Validar']];
 ranking(vid).forEach((c,i)=>{const a=c.analise;if(!a)return;const cg=S.cfg.cega;rows.push([i+1,cg?`Candidato ${i+1}`:c.nome,cg?'':c.email,cg?'':c.telefone,a.det.cidade,cg?'':c.linkedin,a.score,a.det.score,a.ia?.nota??'',REC[a.rec],`${a.det.hard.filter(h=>h.peso==='obrigatoria'&&h.n).length}/${v.hard.filter(h=>h.peso==='obrigatoria').length}`,a.det.exp!=null?(a.det.exp/12).toFixed(1).replace('.',','):'',EDU_N[a.det.form.nivel||0],STATUS[c.status],u([...(a.ia?.fortes||[]),...a.det.fortes]).join(' | '),u([...a.det.ko,...(a.ia?.atenc||[]),...a.det.atenc]).join(' | '),u([...(a.ia?.validar||[]),...a.det.validar]).join(' | ')])});
 baixar(`ranking-${norm(v.titulo).replace(/\s+/g,'-')}.csv`,'\ufeff'+rows.map(r=>r.map(q).join(';')).join('\r\n'),'text/csv;charset=utf-8');toast('Ranking exportado')}

/* ============ link de candidatura (cada vaga recebe currículos por um endereço público) ============ */
async function linkVaga(vid){const v=vagaDe(vid);if(!v)return;
 const cab=`<header><h2>Link de candidatura</h2></header>`;
 if(!NUVEM){modal(`${cab}<div class="body"><p style="margin:0 0 10px">Na conta da sua empresa, cada vaga ganha um endereço como <b>rhworks.lldworks.com.br/vaga/k7p2xq4m</b>. Divulgue no LinkedIn, no WhatsApp ou no site: a pessoa lê a vaga, anexa o currículo ou o PDF do LinkedIn, aceita o aviso de privacidade e cai direto no ranking desta vaga, já com a nota.</p><p class="muted" style="margin:0">Nesta demonstração os dados ficam só no seu navegador, por isso o link não é criado.</p></div><footer><button class="btn pri" data-act="fechar">Entendi</button></footer>`);return}
 modal(`${cab}<div class="body" id="lkBody"><p style="margin:0">Carregando…</p></div><footer><button class="btn" data-act="fechar">Fechar</button></footer>`,{noFocus:true});
 const api=async(m,u,b)=>{const r=await fetch(u,{method:m,credentials:'same-origin',headers:{'Content-Type':'application/json'},body:b?JSON.stringify(b):undefined});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.erro||'Não consegui falar com o servidor.');return j};
 const desenha=l=>{const corpo=$('#lkBody');if(!corpo)return;const aberta=(v.status||'aberta')==='aberta';
  if(!l){corpo.innerHTML=`<p style="margin:0 0 12px">Crie um endereço para esta vaga e receba currículos e perfis do LinkedIn direto no ranking, já analisados.</p><button class="btn pri" id="lkCriar">Criar link da vaga</button>`;$('#lkCriar').onclick=async()=>{$('#lkCriar').disabled=true;try{if(NUVEM.pend||NUVEM.rodando)await new Promise(r=>setTimeout(r,1500));desenha(await api('POST','/api/admin/links',{vagaId:v.id}))}catch(e){toast(esc(e.message),{err:true});$('#lkCriar').disabled=false}};return}
  const msg=encodeURIComponent(`Vaga: ${v.titulo} (${v.cidade}/${v.uf}). Candidate-se: ${l.url}`);
  corpo.innerHTML=`<label class="f">Endereço da vaga<span style="display:flex;gap:8px;margin-top:6px"><input class="in" id="lkUrl" readonly value="${esc(l.url)}" style="flex:1"><button class="btn pri" id="lkCop" type="button">Copiar</button></span></label>
  <p style="margin:14px 0">${l.ativo&&aberta?'<span class="chip ok">● Recebendo candidaturas</span>':'<span class="chip">⏸ Pausado</span>'} ${l.inscritos!=null?`<span class="chip">${l.inscritos} inscrição(ões) pelo link</span>`:''}</p>
  ${aberta?'':'<p class="muted" style="margin:0 0 12px">A vaga está pausada ou encerrada: o link só volta a receber quando ela estiver aberta.</p>'}
  <div style="display:flex;flex-wrap:wrap;gap:8px"><a class="btn" href="${esc(l.url)}" target="_blank" rel="noopener">Abrir a página</a><a class="btn" href="https://wa.me/?text=${msg}" target="_blank" rel="noopener">Enviar no WhatsApp</a><a class="btn" href="https://www.linkedin.com/sharing/share-offsite/?url=${encodeURIComponent(l.url)}" target="_blank" rel="noopener">Publicar no LinkedIn</a><button class="btn ${l.ativo?'danger':''}" id="lkTog" type="button">${l.ativo?'Pausar link':'Reativar link'}</button></div>
  <p class="muted" style="margin:14px 0 0">Quem se inscreve aparece no ranking desta vaga com a nota de aderência. A pessoa aceita o aviso de privacidade antes de enviar.</p>`;
  $('#lkCop').onclick=async()=>{try{await navigator.clipboard.writeText(l.url);toast('Link copiado')}catch(e){$('#lkUrl').select()}};
  $('#lkTog').onclick=async()=>{try{const r=await api('POST',`/api/admin/links/${l.codigo}/${l.ativo?'pausar':'ativar'}`);desenha({...l,ativo:r.ativo});toast(r.ativo?'Link reativado':'Link pausado')}catch(e){toast(esc(e.message),{err:true})}}};
 try{const j=await api('GET','/api/admin/links');desenha(j.links.find(x=>x.vaga_id===v.id)||null)}catch(e){const c=$('#lkBody');if(c)c.innerHTML=`<p style="margin:0">${esc(e.message)}</p>`}}
/* novos candidatos vindos do link chegam sem análise; o RHWorks analisa ao abrir */
function analisarNovos(){const novos=S.cands.filter(c=>!c.analise&&c.texto&&vagaDe(c.vagaId));novos.forEach(c=>{try{analisar(c)}catch(e){console.error('analisar',c.id,e)}});if(novos.length)toast(`${novos.length} nova(s) candidatura(s) pelo link da vaga`)}
